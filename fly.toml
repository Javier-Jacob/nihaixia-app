app = "nihaixia-mobile"
primary_region = "hnd"

[build]
  builder = "heroku/buildpacks:20"

[env]
  PORT = "8080"

[processes]
  web = "node server.js"

[[services]]
  http_checks = []
  internal_port = 8080
  protocol = "tcp"
  scope = "app"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443
